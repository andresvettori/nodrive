name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release
      - name: Publish engine (Native AOT, win-x64)
        run: dotnet publish src/NoDrive.Engine -c Release -r win-x64 -p:PublishAot=true -o artifacts/engine-win-x64
      - name: Report binary size
        shell: pwsh
        run: Get-ChildItem artifacts/engine-win-x64 | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: engine-win-x64
          path: artifacts/engine-win-x64
