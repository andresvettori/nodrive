name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true   # two quick pushes used to race on the ci-binaries force-push

permissions:
  contents: write   # lets the job publish binaries to the ci-binaries branch

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish engine (Native AOT, win-x64)
        run: dotnet publish src/NoDrive.Engine -c Release -r win-x64 -p:PublishAot=true -o artifacts/engine-win-x64

      # P0 spikes: AOT-publishing them here answers "does the WinRT projection / CsWin32 callback code survive
      # Native AOT on .NET 11" without a local C++ toolchain, and gives ready-to-run binaries for the test PC.
      - name: Publish spike aot-baseline (Native AOT, win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          dotnet publish spikes/aot-baseline -c Release -r win-x64 -p:PublishAot=true -o artifacts/spikes/aot-baseline | Tee-Object -FilePath artifacts/spikes/aot-baseline-publish.log
          if ($LASTEXITCODE -ne 0) { throw "aot-baseline publish failed with exit code $LASTEXITCODE" }
      - name: Publish spike cfapi-minimal (Native AOT, win-x64)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          dotnet publish spikes/cfapi-minimal -c Release -r win-x64 -p:PublishAot=true -o artifacts/spikes/cfapi-minimal | Tee-Object -FilePath artifacts/spikes/cfapi-minimal-publish.log
          if ($LASTEXITCODE -ne 0) { throw "cfapi-minimal publish failed with exit code $LASTEXITCODE" }
      - name: Publish spike scale-500k (Native AOT, win-x64)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          dotnet publish spikes/scale-500k -c Release -r win-x64 -p:PublishAot=true -o artifacts/spikes/scale-500k | Tee-Object -FilePath artifacts/spikes/scale-500k-publish.log
          if ($LASTEXITCODE -ne 0) { throw "scale-500k publish failed with exit code $LASTEXITCODE" }
      - name: Publish spike graph-smoke (framework-dependent, any OS)
        if: always()
        run: dotnet publish spikes/graph-smoke -c Release -o artifacts/spikes/graph-smoke

      - name: Add helper scripts to the spikes artifact
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          Copy-Item spikes/measure.ps1, spikes/onedrive-state.ps1, spikes/README.md artifacts/spikes/
          Copy-Item memory_bank/p0-runbook.md artifacts/spikes/P0-RUNBOOK.md

      - name: Report sizes and AOT warnings
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse artifacts -File | Where-Object { $_.Extension -in '.exe','.dll' } |
            Select-Object @{n='Path';e={$_.FullName.Replace("$PWD\",'')}}, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          "--- IL2xxx/IL3xxx warnings in spike publishes (none expected from our code) ---"
          Get-ChildItem artifacts/spikes -Filter *-publish.log -ErrorAction SilentlyContinue | Select-String -Pattern 'IL2\d{3}|IL3\d{3}|error' | ForEach-Object { $_.Line } | Sort-Object -Unique

      # Per-user MSI (WiX v5, pinned to stay on the MS-RL licence). A failure here must not hide the other artifacts: the log is published too.
      - name: Build MSI installer (WiX 5)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $log = 'artifacts/installer/msi-build.log'
          dotnet tool install --global wix --version 5.0.2 2>&1 | Tee-Object $log
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2 2>&1 | Tee-Object -Append $log
          wix build installer/NoDrive.wxs -ext WixToolset.UI.wixext -arch x64 -d EnginePath=artifacts/engine-win-x64 -d Version=0.1.${{ github.run_number }} -o artifacts/installer/NoDrive-x64.msi 2>&1 | Tee-Object -Append $log
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed' }

      # Publish the freshly built binaries to an orphan branch so they can be fetched with plain git over SSH
      # (private repo: artifact downloads need a browser login). The branch is force-pushed on every push to main.
      - name: Publish binaries to the ci-binaries branch
        if: github.ref == 'refs/heads/main' && always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ci-binaries'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse -Force artifacts/spikes/* $dir
          New-Item -ItemType Directory -Force "$dir/engine" | Out-Null
          Copy-Item -Recurse -Force artifacts/engine-win-x64/* "$dir/engine" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$dir/installer" | Out-Null
          Copy-Item -Recurse -Force artifacts/installer/* "$dir/installer" -ErrorAction SilentlyContinue
          "$env:GITHUB_SHA built $(Get-Date -AsUTC -Format o)" | Set-Content "$dir/BUILD.txt"
          Set-Location $dir
          git init -q -b ci-binaries
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -q -m "binaries for $env:GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          $pushed = $false
          foreach ($attempt in 1..4) { git push -q -f origin ci-binaries; if ($LASTEXITCODE -eq 0) { $pushed = $true; break }; Start-Sleep -Seconds (5 * $attempt) }
          if (-not $pushed) { throw 'could not push ci-binaries after 4 attempts' }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-win-x64
          path: artifacts/engine-win-x64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NoDrive-installer-win-x64
          if-no-files-found: warn
          path: artifacts/installer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spikes-win-x64
          if-no-files-found: warn
          path: artifacts/spikes
