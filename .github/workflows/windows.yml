name: windows

on:
  push:
    branches: [main]
    tags: ['v*']          # v0.9.0-beta.142 builds that exact version and publishes a GitHub release
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true   # two quick pushes used to race on the ci-binaries force-push

permissions:
  contents: write   # lets the job publish binaries to the ci-binaries branch

jobs:
  # The portable layers (Core, Graph) and the tests must stay buildable and green on macOS: the macOS port starts from them (memory_bank/macos-plan.md).
  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build NoDrive.slnx -c Release
      - name: Test
        run: dotnet test NoDrive.slnx -c Release --no-build

  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Version policy (memory_bank/release-process.md): display 0.9.0-beta.<build>, file 0.9.0.<build>, MSI 0.9.<build>.
      # Normal builds use the run number as <build>; a tag vX.Y.Z-channel.N uses exactly that version, a tag vX.Y.Z is a stable release.
      - name: Compute version
        shell: pwsh
        run: |
          $props = Get-Content eng/Versioning.props -Raw
          $base = [regex]::Match($props, '<NoDriveBaseVersion[^>]*>([^<]+)<').Groups[1].Value
          $channel = [regex]::Match($props, '<NoDriveChannel[^>]*>([^<]+)<').Groups[1].Value
          $build = $env:GITHUB_RUN_NUMBER
          $stable = 'false'
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)-([A-Za-z]+)\.(\d+)$') { $base = $Matches[1]; $channel = $Matches[2]; $build = $Matches[3] }
          elseif ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $base = $Matches[1]; $channel = ''; $stable = 'true' }
          $display = if ($channel) { "$base-$channel.$build" } else { $base }
          $msi = (($base -split '\.')[0..1] -join '.') + ".$build"
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          @("NoDriveBaseVersion=$base", "NoDriveChannel=$channel", "NoDriveStable=$stable", "NoDriveBuild=$build", "NoDriveCommit=$sha", "NoDriveVersion=$display", "NoDriveMsiVersion=$msi") | Add-Content $env:GITHUB_ENV
          "version $display (msi $msi, commit $sha)"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish engine (Native AOT, win-x64)
        run: dotnet publish src/NoDrive.Engine -c Release -r win-x64 -p:PublishAot=true -o artifacts/engine-win-x64

      # P0 spikes: AOT-publishing them here answers "does the WinRT projection / CsWin32 callback code survive
      # Native AOT on .NET 11" without a local C++ toolchain, and gives ready-to-run binaries for the test PC.
      - name: Publish spike aot-baseline (Native AOT, win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          dotnet publish spikes/aot-baseline -c Release -r win-x64 -p:PublishAot=true -o artifacts/spikes/aot-baseline | Tee-Object -FilePath artifacts/spikes/aot-baseline-publish.log
          if ($LASTEXITCODE -ne 0) { throw "aot-baseline publish failed with exit code $LASTEXITCODE" }
      - name: Publish spike cfapi-minimal (Native AOT, win-x64)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          dotnet publish spikes/cfapi-minimal -c Release -r win-x64 -p:PublishAot=true -o artifacts/spikes/cfapi-minimal | Tee-Object -FilePath artifacts/spikes/cfapi-minimal-publish.log
          if ($LASTEXITCODE -ne 0) { throw "cfapi-minimal publish failed with exit code $LASTEXITCODE" }
      - name: Publish spike scale-500k (Native AOT, win-x64)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          dotnet publish spikes/scale-500k -c Release -r win-x64 -p:PublishAot=true -o artifacts/spikes/scale-500k | Tee-Object -FilePath artifacts/spikes/scale-500k-publish.log
          if ($LASTEXITCODE -ne 0) { throw "scale-500k publish failed with exit code $LASTEXITCODE" }
      - name: Publish spike graph-smoke (framework-dependent, any OS)
        if: always()
        run: dotnet publish spikes/graph-smoke -c Release -o artifacts/spikes/graph-smoke

      - name: Add helper scripts to the spikes artifact
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/spikes | Out-Null
          Copy-Item spikes/measure.ps1, spikes/onedrive-state.ps1, spikes/README.md artifacts/spikes/
          Copy-Item memory_bank/p0-runbook.md artifacts/spikes/P0-RUNBOOK.md

      - name: Report sizes and AOT warnings
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse artifacts -File | Where-Object { $_.Extension -in '.exe','.dll' } |
            Select-Object @{n='Path';e={$_.FullName.Replace("$PWD\",'')}}, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          "--- IL2xxx/IL3xxx warnings in spike publishes (none expected from our code) ---"
          Get-ChildItem artifacts/spikes -Filter *-publish.log -ErrorAction SilentlyContinue | Select-String -Pattern 'IL2\d{3}|IL3\d{3}|error' | ForEach-Object { $_.Line } | Sort-Object -Unique

      # Per-user MSI (WiX v5, pinned to stay on the MS-RL licence). A failure here must not hide the other artifacts: the log is published too.
      - name: Build MSI installer (WiX 5)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $log = 'artifacts/installer/msi-build.log'
          $msiName = "NoDrive-$($env:NoDriveVersion)-x64.msi"
          dotnet tool install --global wix --version 5.0.2 2>&1 | Tee-Object $log
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2 2>&1 | Tee-Object -Append $log
          wix build installer/NoDrive.wxs -ext WixToolset.UI.wixext -arch x64 -d EnginePath=artifacts/engine-win-x64 -d Version=$($env:NoDriveMsiVersion) -d DisplayVersion=$($env:NoDriveVersion) -o "artifacts/installer/$msiName" 2>&1 | Tee-Object -Append $log
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed' }
          Copy-Item "artifacts/installer/$msiName" artifacts/installer/NoDrive-x64.msi       # stable alias for the test scripts
          Get-FileHash "artifacts/installer/$msiName" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $msiName" } | Set-Content artifacts/installer/SHA256SUMS.txt
          # The downloadable artifact holds only what a user needs; the alias, debug file and build log stay in artifacts/installer (published on ci-binaries).
          New-Item -ItemType Directory -Force artifacts/installer-release | Out-Null
          Copy-Item "artifacts/installer/$msiName", artifacts/installer/SHA256SUMS.txt artifacts/installer-release/

      # ARM64 (Windows on Arm): cross-compiled on the x64 runner. Never blocks the x64 build; the binaries are untested until run on an ARM64 PC or VM.
      - name: Build ARM64 engine, MSI and MSIX (Native AOT, cross-compiled)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish src/NoDrive.Engine -c Release -r win-arm64 -p:PublishAot=true -o artifacts/engine-win-arm64
          if ($LASTEXITCODE -ne 0) { throw 'arm64 publish failed' }
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $msiName = "NoDrive-$($env:NoDriveVersion)-arm64.msi"
          wix build installer/NoDrive.wxs -ext WixToolset.UI.wixext -arch arm64 -d EnginePath=artifacts/engine-win-arm64 -d Version=$($env:NoDriveMsiVersion) -d DisplayVersion=$($env:NoDriveVersion) -o "artifacts/installer/$msiName"
          if ($LASTEXITCODE -ne 0) { throw 'arm64 wix build failed' }
          $parts = $env:NoDriveMsiVersion -split '\.'
          pwsh tools/build-msix.ps1 -EngineDir artifacts/engine-win-arm64 -Arch arm64 -Version "$($parts[0]).$($parts[1]).$($parts[2]).0" -Output "artifacts/installer/NoDrive-$($env:NoDriveVersion)-arm64.msix"

      # Publish the freshly built binaries to an orphan branch so they can be fetched with plain git over SSH
      # (private repo: artifact downloads need a browser login). The branch is force-pushed on every push to main.
      - name: Build MSIX (Microsoft Store; unsigned, the Store signs it)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $parts = $env:NoDriveMsiVersion -split '\.'
          $msixVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"   # the Store reserves the 4th number
          pwsh tools/build-msix.ps1 -EngineDir artifacts/engine-win-x64 -Version $msixVersion -Output "artifacts/installer/NoDrive-$($env:NoDriveVersion)-x64.msix"

      - name: Publish binaries to the ci-binaries branch
        if: github.ref == 'refs/heads/main' && always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ci-binaries'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse -Force artifacts/spikes/* $dir
          New-Item -ItemType Directory -Force "$dir/engine" | Out-Null
          Copy-Item -Recurse -Force artifacts/engine-win-x64/* "$dir/engine" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$dir/installer" | Out-Null
          Copy-Item -Recurse -Force artifacts/installer/* "$dir/installer" -ErrorAction SilentlyContinue
          "$env:GITHUB_SHA built version $($env:NoDriveVersion) $(Get-Date -AsUTC -Format o)" | Set-Content "$dir/BUILD.txt"
          Set-Location $dir
          git init -q -b ci-binaries
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -q -m "binaries for $env:GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          $pushed = $false
          foreach ($attempt in 1..4) { git push -q -f origin ci-binaries; if ($LASTEXITCODE -eq 0) { $pushed = $true; break }; Start-Sleep -Seconds (5 * $attempt) }
          if (-not $pushed) { throw 'could not push ci-binaries after 4 attempts' }

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh tools/release-notes.ps1 -Version $env:NoDriveVersion | Set-Content notes.md
          $pre = if ($env:NoDriveChannel) { '--prerelease' } else { '' }
          $arm = "artifacts/installer/NoDrive-$($env:NoDriveVersion)-arm64.msi"
          $assets = @("artifacts/installer/NoDrive-$($env:NoDriveVersion)-x64.msi")
          if (Test-Path $arm) { $assets += $arm }
          Get-ChildItem artifacts/installer -Filter "NoDrive-$($env:NoDriveVersion)-*.msi" | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" } | Set-Content artifacts/installer/SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME @assets artifacts/installer/SHA256SUMS.txt --title "NoDrive $($env:NoDriveVersion)" --notes-file notes.md $pre
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-win-x64
          path: artifacts/engine-win-x64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NoDrive-installer-win-x64
          if-no-files-found: warn
          path: artifacts/installer-release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spikes-win-x64
          if-no-files-found: warn
          path: artifacts/spikes
